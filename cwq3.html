<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>Count : <span id="count">0</span></p>
    <button onclick="inc()" id="b1">Increment</button>
    <button onclick="dec()" id="b2">Decrement</button>
    <button onclick="clearData()" id="b3">Reset</button>
    <script>
        let count = 0
        function inc() {
            document.getElementById("count").textContent = count++
        }
        function dec() {
            document.getElementById("count").textContent = count--
        }
        function clearData() {
            document.getElementById("count").textContent = 0
        }
    </script>
</body>

</html>
