<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    Name:
    <input type="text" name="" id="name"><br><br>
    Email:
    <input type="email" name="" id="email"><br><br>
    Password:
    <input type="password" name="" id="password"><br><br>
    Query:
    <input type="text" name="" id="query"><br><br>
    <button type="submit" id="b1">Submit</button>
    <script>
        const b1 = document.getElementById("b1")
        b1.addEventListener("click", () => {
            const name = document.getElementById("name").value
            const nameReg = /^[A-Za-z]+$/

            const email = document.getElementById("email").value
            const emailReg = /[^\s@]+@[^\s@]+\.[^\s@]/

            const password = document.getElementById("password").value
            const passReg = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/

            const query = document.getElementById("query").value


            if (!nameReg.test(name)) {
                alert("Invalid name")
            } if (!emailReg.test(email)) {
                alert("Invalid email")
            } if (!passReg.test(password)) {
                alert("Invalid Password")
            } if (query.length <= 10) {
                alert("Query > 10")
            }

            else {
                alert("Successful")
            }
            localStorage.setItem("name", name)
            localStorage.setItem("email", email)
            localStorage.setItem("query", query)
        })
    </script>

</body>

</html>
